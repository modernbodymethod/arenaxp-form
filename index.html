function dbPut(k,v){return new Promise(function(res){if(!db)return res(false);try{var t=db.transaction("files","readwrite");t.objectStore("files").put(v,k);t.oncomplete=function(){res(true);};t.onerror=function(){res(false);};}catch(e){res(false);}});}
function dbAll(){return new Promise(function(res){if(!db)return res({});try{var out={},t=db.transaction("files","readonly"),st=t.objectStore("files"),c=st.openCursor();c.onsuccess=function(){var cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue();}else res(out);};c.onerror=function(){res({});};}catch(e){res({});}});}
function persistFiles(qid){dbPut(qid,FILES[qid]||[]).then(function(ok){if(!ok)showNotice("files","Attachments can't be kept in this browser after you close it. Press Send to Mac once you've added them.");});}

/* completion */
function isDone(q){var a=state.answers[q.id];
  if(q.type==="choice")return !!(a&&a.choice);
  if(q.type==="file")return (FILES[q.id]&&FILES[q.id].length>0)||!!(a&&a.link&&a.link.trim());
  if(q.type==="contacts")return !!(a&&a.rows&&a.rows.some(function(r){return (r.name||"").trim()||(r.org||"").trim();}));
  return !!(a&&String(a).trim());}
function progress(){var qs=allQs(),done=0,priLeft=0;
  qs.forEach(function(x){var d=isDone(x.q);if(d)done++;else if(x.s.priority)priLeft++;
    var qe=document.getElementById("q-"+x.q.id);if(qe)qe.classList.toggle("ok",d);});
  var pct=Math.round(done/qs.length*100);
  document.getElementById("barfill").style.width=pct+"%";document.getElementById("pct").textContent=pct+"%";
  document.getElementById("prileft").textContent=priLeft?priLeft+" priority "+(priLeft===1?"answer":"answers")+" left":"Priority answers done";
  SECTIONS.forEach(function(s){var n=0;s.qs.forEach(function(q){if(isDone(q))n++;});var a=document.getElementById("rail-"+s.id);if(!a)return;
    a.querySelector("small").textContent=n+"/"+s.qs.length;a.querySelector(".fill i").style.height=(n/s.qs.length*100)+"%";a.classList.toggle("done",n===s.qs.length);});}

var notices={};
function showNotice(key,msg,info){if(notices[key])return;notices[key]=1;var n=el("div",{"class":"notice on"+(info?" info":""),role:"status"},esc(msg));document.getElementById("notices").appendChild(n);}

/* render */
function render(){
  var app=document.getElementById("app");
  var top=el("header",{"class":"top"});
  top.innerHTML='<div class="top-inner"><div class="brand">Prescia<span>IQ</span></div><div class="meter"><div class="bar" aria-hidden="true"><i id="barfill"></i></div><b id="pct">0%</b><span class="pri-left" id="prileft"></span></div><button class="btn" type="button" id="sendTop">Send to Mac</button></div>';
  app.appendChild(top);
  var wrap=el("div",{"class":"wrap"}),rail=el("nav",{"class":"rail","aria-label":"Sections"}),main=el("main");
  var lastGroup=null;
  SECTIONS.forEach(function(s){var g=s.priority?"Start here":s.group;if(g!==lastGroup){rail.appendChild(el("h4",null,esc(g)));lastGroup=g;}
    var a=el("a",{href:"#sec-"+s.id,id:"rail-"+s.id},'<span class="fill"><i></i></span><span>'+esc(s.title)+(s.priority?' <span style="color:var(--flag)">&#9679;</span>':"")+'</span><small></small>');rail.appendChild(a);});
  main.innerHTML='<div class="mac" id="macPanel"></div><div class="intro-block"><div class="client">ArenaXP and SwimXP, website and CRM build</div><h1>Information needed from Ali and Laila</h1><div class="due">Priority items by Friday 2 October. Everything else by Friday 9 October.</div><p>Everything we need goes in here. Rough dot points are fine: we turn your answers into website copy, booking flows and outreach.</p><ol><li>Start with the sections marked Priority.</li><li>Your answers and files save on this computer as you type, so you can close the page and come back.</li><li>Questions tagged Laila are the visual and brand calls.</li><li>When you\'re done, press <b>Send to Mac</b>. Your answers and files go straight to Mac. You can send again any time: the newest version replaces the old one.</li></ol><p class="saved"></p></div><div id="notices"></div>';
  SECTIONS.forEach(function(s){main.appendChild(renderSection(s));});
  var send=el("section",{"class":"send",id:"send"});
  send.innerHTML='<h2>Send your answers to Mac</h2><p>Your answers and files go straight to Mac. Leave this page open until it says they\'re sent. You can send again any time: the newest version replaces the old one.</p><div class="progress-box" id="sendStatus" role="status"></div><div class="crow-actions"><button class="btn" type="button" id="sendBottom">Send to Mac</button><button class="btn ghost" type="button" id="backupBottom">Download a backup copy</button></div><p class="saved"></p>';
  main.appendChild(send);
  wrap.appendChild(rail);wrap.appendChild(main);app.appendChild(wrap);
  document.getElementById("sendTop").onclick=sendToMac;document.getElementById("sendBottom").onclick=sendToMac;document.getElementById("backupBottom").onclick=exportFile;
}
function renderSection(s){
  var sec=el("section",{"class":"sec",id:"sec-"+s.id});
  var tags=(s.priority?'<span class="tag pri">Priority</span>':"")+(s.owner==="Laila"?'<span class="tag layla">Laila</span>':"");
  sec.innerHTML='<div class="sec-head"><span class="grp">'+esc(s.group)+'</span>'+tags+'<h2>'+esc(s.title)+'</h2></div>'+(s.intro?'<div class="sec-intro">'+esc(s.intro)+'</div>':"");
  s.qs.forEach(function(q,i){sec.appendChild(renderQ(q,i+1,s));});return sec;}
function head(q,n,forId){var h='<span class="num">'+n+'</span><span>'+esc(q.label)+'</span>'+(q.hint?'<span class="hint">'+esc(q.hint)+'</span>':"");
  return forId?'<label class="ql" for="'+forId+'">'+h+'</label>':'<div class="ql">'+h+'</div>';}
function renderQ(q,n){
  var box=el("div",{"class":"q",id:"q-"+q.id}),a=state.answers[q.id];
  if(!q.type){box.innerHTML=head(q,n,"in-"+q.id);var ans=el("div",{"class":"ans"});var t=el("textarea",{id:"in-"+q.id,rows:"3"});t.value=a||"";
    t.addEventListener("input",function(){state.answers[q.id]=t.value;grow(t);save();progress();});ans.appendChild(t);box.appendChild(ans);setTimeout(function(){grow(t);},0);}
  else if(q.type==="choice"){box.innerHTML=head(q,n);var ans2=el("div",{"class":"ans"}),opts=el("div",{"class":"opts",role:"radiogroup"});a=a||{};
    q.options.forEach(function(o,i){var lab=el("label");var r=el("input",{type:"radio",name:"r-"+q.id,value:o});if(a.choice===o)r.checked=true;
      r.addEventListener("change",function(){var cur=state.answers[q.id]||{};cur.choice=o;state.answers[q.id]=cur;save();progress();});lab.appendChild(r);lab.appendChild(el("span",null,esc(o)));opts.appendChild(lab);});
    ans2.appendChild(opts);
    var nt=el("textarea",{"class":"note",rows:"2",placeholder:q.note||"Anything to add?","aria-label":q.note||"Notes"});nt.value=a.note||"";
    nt.addEventListener("input",function(){var cur=state.answers[q.id]||{};cur.note=nt.value;state.answers[q.id]=cur;grow(nt);save();});ans2.appendChild(nt);box.appendChild(ans2);}
  else if(q.type==="file"){box.innerHTML=head(q,n);box.appendChild(renderFiles(q));}
  else if(q.type==="contacts"){box.innerHTML=head(q,n);box.appendChild(renderContacts(q));}
  return box;}
function grow(t){t.style.height="auto";t.style.height=Math.max(76,t.scrollHeight+2)+"px";}

function renderFiles(q){
  var ans=el("div",{"class":"ans"}),a=state.answers[q.id]||{};
  var drop=el("div",{"class":"drop"});var inp=el("input",{type:"file",multiple:"",id:"in-"+q.id,"aria-label":"Add files"});
  drop.appendChild(inp);drop.appendChild(el("span",{"class":"saved",style:"font-size:13px"},"Up to "+MAX_MB+" MB per file"));ans.appendChild(drop);
  var list=el("div",{"class":"files"});ans.appendChild(list);
  var lk=el("input",{type:"url","class":"linkrow",placeholder:"Or paste a Google Drive, Dropbox or WeTransfer link","aria-label":"Shared folder link"});lk.value=a.link||"";
  lk.addEventListener("input",function(){var cur=state.answers[q.id]||{};cur.link=lk.value;state.answers[q.id]=cur;save();progress();});ans.appendChild(lk);
  function draw(){list.innerHTML="";(FILES[q.id]||[]).forEach(function(f,i){var row=el("div",{"class":"file"});row.innerHTML='<span class="n">'+esc(f.name)+'</span><span class="s">'+fmtSize(f.size)+'</span>';
    var dl=el("button",{"class":"lnk",type:"button"},"Download");dl.onclick=function(){downloadData(f.data,f.name);};
    var rm=el("button",{"class":"lnk rm",type:"button"},"Remove");rm.onclick=function(){FILES[q.id].splice(i,1);persistFiles(q.id);state.updatedAt=Date.now();save();draw();progress();};
    row.appendChild(dl);row.appendChild(rm);list.appendChild(row);});}
  inp.addEventListener("change",function(){var fl=Array.prototype.slice.call(inp.files);inp.value="";
    fl.forEach(function(file){if(file.size>MAX_MB*1048576){showNotice("big-"+file.name,file.name+" is over "+MAX_MB+" MB. Put it in a Google Drive or Dropbox folder and paste the link instead.");return;}
      var r=new FileReader();r.onload=function(){FILES[q.id]=FILES[q.id]||[];FILES[q.id].push({name:file.name,type:file.type,size:file.size,data:r.result,uploaded:false});persistFiles(q.id);save();draw();progress();};r.readAsDataURL(file);});});
  draw();return ans;}

function renderContacts(q){
  var ans=el("div",{"class":"ans"}),a=state.answers[q.id]||{rows:[]};if(!a.rows)a.rows=[];state.answers[q.id]=a;
  var wrapT=el("div",{"class":"cwrap"}),tbl=el("table",{"class":"ctable"});
  tbl.innerHTML='<thead><tr><th>Name</th><th>Organisation</th><th>Type</th><th>Phone</th><th>Email</th><th>Notes</th><th></th></tr></thead>';
  var tb=el("tbody");tbl.appendChild(tb);wrapT.appendChild(tbl);ans.appendChild(wrapT);
  var fields=["name","org","type","phone","email","notes"];
  function draw(){tb.innerHTML="";a.rows.forEach(function(r,i){var tr=el("tr");
    fields.forEach(function(f){var td=el("td"),c;
      if(f==="type"){c=el("select",{"aria-label":"Type"});c.appendChild(el("option",{value:""},"Choose"));CTYPES.forEach(function(t){var o=el("option",{value:t},esc(t));if(r.type===t)o.selected=true;c.appendChild(o);});c.addEventListener("change",function(){r.type=c.value;save();});}
      else{c=el("input",{type:f==="email"?"email":"text","aria-label":f});c.value=r[f]||"";c.addEventListener("input",function(){r[f]=c.value;save();progress();});}
      td.appendChild(c);tr.appendChild(td);});
    var td=el("td"),rm=el("button",{"class":"lnk rm",type:"button","aria-label":"Remove row"},"Remove");rm.onclick=function(){a.rows.splice(i,1);save();draw();progress();};td.appendChild(rm);tr.appendChild(td);tb.appendChild(tr);});}
  var acts=el("div",{"class":"crow-actions"});var add=el("button",{"class":"btn ghost",type:"button"},"Add a contact");add.onclick=function(){a.rows.push({});save();draw();var ins=tb.querySelectorAll("tr:last-child input");if(ins[0])ins[0].focus();};
  var csv=el("button",{"class":"btn ghost",type:"button"},"Download contacts as CSV");csv.onclick=exportCSV;
  acts.appendChild(add);acts.appendChild(csv);ans.appendChild(acts);
  if(!a.rows.length)a.rows.push({},{},{});draw();return ans;}

/* output */
function answerText(q){var a=state.answers[q.id];
  if(q.type==="choice"){if(!a||(!a.choice&&!a.note))return "";return (a.choice||"No option picked")+(a.note?"\n"+a.note:"");}
  if(q.type==="file"){var f=(FILES[q.id]||[]).map(function(x){return x.name+" ("+fmtSize(x.size)+")";});if(a&&a.link)f.push("Link: "+a.link);return f.join("\n");}
  if(q.type==="contacts"){return "";}
  return a||"";}
function contactRows(){var a=state.answers.k1;return a&&a.rows?a.rows.filter(function(r){return (r.name||"").trim()||(r.org||"").trim();}):[];}
function buildReport(ts){var h='<h1>ArenaXP and SwimXP: answers from Ali and Laila</h1><p>Sent '+esc(fmtDate(ts))+'. To download attachments, open this file in Chrome, Edge or Safari on a laptop.</p>';
  SECTIONS.forEach(function(s){h+='<h2>'+esc(s.group+": "+s.title)+'</h2>';
    if(s.qs[0].type==="contacts"){var rows=contactRows();if(!rows.length){h+='<p class="empty">No contacts added.</p>';return;}
      h+='<table><tr><th>Name</th><th>Organisation</th><th>Type</th><th>Phone</th><th>Email</th><th>Notes</th></tr>';rows.forEach(function(r){h+='<tr><td>'+esc(r.name)+'</td><td>'+esc(r.org)+'</td><td>'+esc(r.type)+'</td><td>'+esc(r.phone)+'</td><td>'+esc(r.email)+'</td><td>'+esc(r.notes)+'</td></tr>';});h+='</table>';return;}
    h+='<dl>';s.qs.forEach(function(q,i){var t=answerText(q);h+='<dt>'+(i+1)+'. '+esc(q.label)+'</dt><dd'+(t?'':' class="empty"')+'>'+(t?esc(t):'Not answered')+'</dd>';});h+='</dl>';});
  return h;}

/* online sending */
var sending=false;
function status(msg,kind){var b=document.getElementById("sendStatus");if(!b)return;b.className="progress-box on"+(kind?" "+kind:"");b.textContent=msg;}
function postJSON(o){o.secret=SECRET;return fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(o),redirect:"follow"})
  .then(function(r){return r.json();}).then(function(j){if(!j||!j.ok)throw new Error(j&&j.error||"No reply");return j;});}
function payloadAnswers(){var out=[];SECTIONS.forEach(function(s){if(s.qs[0].type==="contacts")return;s.qs.forEach(function(q,i){out.push({section:s.group+": "+s.title,n:i+1,question:q.label,answer:answerText(q)});});});return out;}
function sendToMac(){
  if(sending)return;
  if(!ENDPOINT){exportFile();return;}
  document.getElementById("send").scrollIntoView({behavior:"smooth"});
  if(!state.submissionId){state.submissionId="S"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);save();}
  var list=[];for(var k in FILES)(FILES[k]||[]).forEach(function(f){list.push({qid:k,f:f});});
  var todo=list.filter(function(x){return !x.f.uploaded;});
  var qlabel={};allQs().forEach(function(x){qlabel[x.q.id]=x.q.label;});
  sending=true;setBtns(true);status("Sending your answers...");
  postJSON({action:"submit",client:CLIENT,submissionId:state.submissionId,answers:payloadAnswers(),contacts:contactRows(),fileCount:list.length})
  .then(function(){var i=0;
    function next(){if(i>=todo.length)return Promise.resolve();var x=todo[i++];status("Answers sent. Uploading file "+i+" of "+todo.length+": "+x.f.name);
      return postJSON({action:"file",client:CLIENT,submissionId:state.submissionId,question:qlabel[x.qid]||x.qid,name:x.f.name,type:x.f.type,size:x.f.size,data:String(x.f.data).split(",")[1]||""})
        .then(function(){x.f.uploaded=true;persistFiles(x.qid);return next();});}
    return next();})
  .then(function(){state.sentAt=Date.now();save();status("Sent. Mac has your answers"+(list.length?" and "+list.length+" file"+(list.length>1?"s":""):"")+". You can close this page.","good");})
  .catch(function(){status("It didn't send, most likely the internet dropped. Your answers are still saved here. Press Send to Mac again, or use Download a backup copy and email that file to "+SEND_TO+".","bad");})
  .then(function(){sending=false;setBtns(false);});
}
function setBtns(d){["sendTop","sendBottom"].forEach(function(id){var b=document.getElementById(id);if(b){b.disabled=d;b.textContent=d?"Sending...":"Send to Mac";}});}

function exportFile(){
  var ts=Date.now();
  var clone=document.documentElement.cloneNode(true);
  var body=clone.querySelector("body");body.classList.remove("js");if(!body.className)body.removeAttribute("class");
  clone.querySelector("#app").innerHTML="";
  clone.querySelector("#report").innerHTML=buildReport(ts);
  var payload={exportedAt:ts,answers:state.answers,files:FILES};
  clone.querySelector("#baked").textContent=JSON.stringify(payload).replace(/</g,"\\u003c");
  var html="<!DOCTYPE html>\n"+clone.outerHTML;
  var d=new Date(ts),name="ArenaXP-SwimXP-answers-"+d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+".html";
  downloadBlob(new Blob([html],{type:"text/html"}),name);
  showNotice("sent-"+ts,"Saved "+name+" to your Downloads folder. Email that file to "+SEND_TO+".",true);
}
function exportText(){var t="ArenaXP and SwimXP: answers from Ali and Laila\n"+fmtDate(Date.now())+"\n";
  SECTIONS.forEach(function(s){t+="\n== "+s.group+": "+s.title+" ==\n";
    if(s.qs[0].type==="contacts"){contactRows().forEach(function(r){t+="- "+[r.name,r.org,r.type,r.phone,r.email,r.notes].filter(Boolean).join(" | ")+"\n";});return;}
    s.qs.forEach(function(q,i){t+="\n"+(i+1)+". "+q.label+"\n"+(answerText(q)||"Not answered")+"\n";});});
  downloadBlob(new Blob([t],{type:"text/plain"}),"ArenaXP-SwimXP-answers.txt");}
function exportCSV(){var rows=contactRows(),q=function(v){return '"'+String(v||"").replace(/"/g,'""')+'"';};
  var c="Name,Organisation,Type,Phone,Email,Notes\n"+rows.map(function(r){return [r.name,r.org,r.type,r.phone,r.email,r.notes].map(q).join(",");}).join("\n");
  downloadBlob(new Blob([c],{type:"text/csv"}),"ArenaXP-contacts.csv");}
function downloadBlob(b,name){var u=URL.createObjectURL(b),a=el("a",{href:u,download:name});document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove();},1500);}
function downloadData(dataUrl,name){fetch(dataUrl).then(function(r){return r.blob();}).then(function(b){downloadBlob(b,name);});}

function macPanel(){if(!fromBaked)return;var p=document.getElementById("macPanel");p.classList.add("on");
  var nf=0;for(var k in FILES)nf+=(FILES[k]||[]).length;
  p.innerHTML='<h3>Answers sent '+esc(fmtDate(fromBaked))+'</h3><p style="margin:0;color:#cfd6cf">Everything below is filled in from this file. '+nf+' attachment'+(nf===1?"":"s")+' inside, each with a Download button.</p>';
  var row=el("div",{"class":"row"});var b1=el("button",{"class":"btn",type:"button"},"Download answers as text");b1.onclick=exportText;
  var b2=el("button",{"class":"btn ghost",type:"button"},"Download contacts as CSV");b2.onclick=exportCSV;row.appendChild(b1);row.appendChild(b2);p.appendChild(row);}

/* boot */
openDB().then(function(d){db=d;return dbAll();}).then(function(local){
  var baked=null;try{baked=JSON.parse(document.getElementById("baked").textContent);}catch(e){}
  var ls=loadLocal();
  if(baked&&(!ls||(ls.updatedAt||0)<=baked.exportedAt)){state={answers:baked.answers||{},updatedAt:baked.exportedAt};FILES=baked.files||{};fromBaked=baked.exportedAt;
    try{localStorage.setItem(FORM_KEY,JSON.stringify(state));}catch(e){}for(var k in FILES)dbPut(k,FILES[k]);}
  else{if(ls)state=ls;FILES=local||{};}
  render();macPanel();progress();
  if(!storageOK)showNotice("autosave","Autosave isn't working in this browser. Press Send to Mac before you close the page so nothing is lost.");
  if(!db)showNotice("files","Attachments can't be kept in this browser after you close it. Press Send to Mac once you've added them.");
  stamp(state.updatedAt&&!fromBaked?"Last saved "+fmtDate(state.updatedAt):"");
});
})();
</script>
</body></html>
